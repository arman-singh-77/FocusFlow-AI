kind = "web"
previewPath = "/"
title = "FocusFlow AI"
description = "A student productivity dashboard for organizing today's study tasks, tracking progress, and starting focused work sessions. This first version uses sample tasks and browser storage without a database or AI integration."
version = "1.0.0"
id = "artifacts/focusflow-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23064

[services.development]
run = "pnpm --filter @workspace/focusflow-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focusflow-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/focusflow-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23064"
BASE_PATH = "/"

[[services]]
name = "focusflow-api"
paths = [ "/focusflow-api" ]
localPort = 8000

[services.development]
run = "uv run --project ../.. --no-sync python -m uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT"

[services.production.build]
args = [ "uv", "sync", "--project", "." ]

[services.production.run]
args = [ "uv", "run", "--project", ".", "--no-sync", "python", "-m", "uvicorn", "main:app", "--app-dir", "artifacts/focusflow-ai/backend", "--host", "0.0.0.0", "--port", "8000" ]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/focusflow-api/healthz"

[services.env]
PORT = "8000"
